name: Reconcile pins

# pin-plugin.yml waits for npm itself, so a tag's dispatch is the pin. This run
# compares each plugin's newest release tag with its pin and requests the pin
# again, which recovers a dispatch that never arrived or a pin run that timed
# out. Once a day bounds that recovery at a day; workflow_dispatch runs it now.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Request pins behind their newest tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          jq -r '.plugins[] | [.name, .version, .source.url] | @tsv' .claude-plugin/marketplace.json |
          while IFS=$'\t' read -r NAME PINNED URL; do
            # An annotated tag lists twice, the tag object and the commit it
            # points at (^{}). The pin needs the commit, so the peeled line wins.
            TAG=$(git ls-remote --tags "$URL" \
                  | sed -nE 's#^([0-9a-f]{40})\trefs/tags/(v[0-9]+\.[0-9]+\.[0-9]+)(\^\{\})?$#\2 \1 \3#p' \
                  | sort -k1,1V -k3,3 | tail -1)
            [ -n "$TAG" ] || { echo "$NAME: no release tags"; continue; }
            REF=${TAG%% *}; SHA=$(echo "$TAG" | cut -d' ' -f2); VERSION=${REF#v}
            NEWEST=$(printf '%s\n%s\n' "$PINNED" "$VERSION" | sort -V | tail -1)
            if [ "$VERSION" = "$PINNED" ] || [ "$NEWEST" = "$PINNED" ]; then
              echo "$NAME: pinned $PINNED, newest tag $REF"; continue
            fi
            # An open PR is waiting on a merge; a closed one is a release
            # turned down. Either way a new request would only reopen it.
            BRANCH="pin/$NAME-$VERSION"
            if [ -n "$(gh pr list --head "$BRANCH" --state all --json number --jq '.[].number')" ]; then
              echo "$NAME: $BRANCH already has a PR"; continue
            fi
            echo "$NAME: pinned $PINNED, requesting $REF @ ${SHA:0:8}"
            gh workflow run pin-plugin.yml \
              -f name="$NAME" -f version="$VERSION" -f sha="$SHA" -f ref="$REF"
          done
